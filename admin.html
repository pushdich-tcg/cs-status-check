<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Aufträge – Collectible Submission</title>
<style>
  :root { --bg:#000; --s1:#0B1016; --s2:#121A23; --ln:#1C2631; --ln2:#2A3744; --ink:#F2F6F8; --mut:#8E9BAA; --cy:#1EC8F0; --cyi:#03131A; --pk:#A3159F; --ok:#2FD07F; --bad:#F97066; --warn:#F5B544; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  header { position:sticky; top:0; z-index:5; background:rgba(0,0,0,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--ln); }
  .bar { max-width:1100px; margin:0 auto; padding:12px 16px; display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .brand { font-style:italic; font-weight:900; text-transform:uppercase; line-height:.95; font-size:15px; margin-right:6px; }
  .brand span { display:block; color:var(--cy); }
  input, select, textarea { font:inherit; color:var(--ink); background:var(--s1); border:1.5px solid var(--ln2); border-radius:10px; padding:9px 11px; outline:none; }
  input:focus, select:focus, textarea:focus { border-color:var(--cy); }
  .search { flex:1; min-width:180px; }
  button { font:inherit; cursor:pointer; border:0; border-radius:10px; padding:9px 13px; font-weight:700; }
  .b-cy { background:var(--cy); color:var(--cyi); }
  .b-gh { background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--ln2); }
  .chips { display:flex; gap:4px; }
  .chip { background:transparent; color:var(--mut); box-shadow:inset 0 0 0 1.5px var(--ln2); padding:7px 11px; }
  .chip[aria-pressed="true"] { background:var(--s2); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--cy); }
  main { max-width:1100px; margin:0 auto; padding:16px 16px 80px; }
  .note { border-left:4px solid var(--warn); background:rgba(245,181,68,.1); padding:10px 12px; border-radius:0 10px 10px 0; margin-bottom:14px; font-size:14px; }
  .card { background:var(--s1); border:1px solid var(--ln); border-radius:16px; padding:16px; margin-bottom:10px; }
  .card.is-done { opacity:.6; }
  .top { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:baseline; }
  .nr { font-weight:900; font-style:italic; font-size:20px; }
  .who b { font-weight:700; }
  .mut { color:var(--mut); font-size:13px; }
  .tag { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; padding:3px 8px; border-radius:5px; background:var(--s2); }
  .tag.psa { background:rgba(30,200,240,.15); color:var(--cy); }
  .tag.gsg { background:rgba(163,21,159,.25); color:#E05ADF; }
  .tag.pick { background:rgba(245,181,68,.15); color:var(--warn); }
  .items { margin:8px 0 12px; font-size:14px; color:#C9D2DC; }
  .items i { color:var(--mut); font-style:normal; }
  .fields { display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); margin-bottom:12px; }
  .fields label { display:grid; gap:3px; font-size:12px; color:var(--mut); font-weight:600; }
  .stages { display:grid; gap:6px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
  .st { display:flex; gap:9px; align-items:center; text-align:left; width:100%; background:#000; color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--ln2); padding:10px; font-weight:600; }
  .st i { flex:none; width:22px; height:22px; border-radius:7px; border:2px solid var(--ln2); display:grid; place-items:center; font-style:normal; font-size:13px; }
  .st.on { box-shadow:inset 0 0 0 1.5px var(--ok); }
  .st.on i { background:var(--ok); border-color:var(--ok); color:#00150A; }
  .st small { display:block; font-weight:400; color:var(--mut); font-size:11.5px; }
  .st[disabled] { opacity:.5; cursor:progress; }
  .foot { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; margin-top:10px; align-items:center; }
  .log { font-size:12px; color:var(--mut); }
  .acts { display:flex; gap:6px; }
  .acts button { padding:6px 10px; font-size:12px; }
  dialog { background:var(--s1); color:var(--ink); border:1px solid var(--ln2); border-radius:18px; padding:20px; width:min(520px,94vw); }
  dialog::backdrop { background:rgba(0,0,0,.7); }
  dialog form { display:grid; gap:10px; }
  dialog label { display:grid; gap:4px; font-size:13px; color:var(--mut); font-weight:600; }
  .toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:#000; font-weight:700; padding:11px 16px; border-radius:12px; opacity:0; transition:.25s; pointer-events:none; max-width:92vw; }
  .toast.on { opacity:1; }
  .empty { color:var(--mut); text-align:center; padding:40px 0; }
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand">Collectible<span>Submission</span></div>
  <input class="search" type="search" placeholder="Suchen: Nummer, Name, E-Mail, PSA-Nr." data-q>
  <div class="chips" role="group" aria-label="Filter">
    <button class="chip" data-f="open" aria-pressed="true">Offen</button>
    <button class="chip" data-f="all" aria-pressed="false">Alle</button>
    <button class="chip" data-f="arch" aria-pressed="false">Archiv</button>
  </div>
  <button class="b-cy" data-new>+ Auftrag</button>
  <button class="b-gh" data-more>Mehr</button>
</div></header>
<main>
  <div data-notes></div>
  <div data-list><p class="empty">Lädt …</p></div>
</main>

<dialog data-dlg-new><form method="dialog" data-form-new>
  <b style="font-size:18px">Auftrag von Hand anlegen</b>
  <label>Bestellnummer *<input name="nr" required placeholder="1041"></label>
  <label>Name<input name="name" placeholder="Max Muster"></label>
  <label>E-Mail *<input name="email" type="email" required placeholder="max@beispiel.de"></label>
  <label>Services (eine Zeile pro Service, z. B. „2x PSA Grading Standard“)<textarea name="items" rows="3"></textarea></label>
  <label>Firma<select name="grader"><option value="">automatisch</option><option>PSA</option><option>GSG</option></select></label>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="pickup"> Abholung im Laden</label>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="b-gh" value="cancel" formnovalidate>Abbrechen</button><button class="b-cy" value="ok">Anlegen</button></div>
</form></dialog>

<dialog data-dlg-more><form method="dialog">
  <b style="font-size:18px">Weitere Funktionen</b>
  <label>Test-Mail an<input name="to" type="email" placeholder="deine@adresse.de" data-test-to></label>
  <button class="b-gh" type="button" data-test>Test-Mail senden</button>
  <button class="b-gh" type="button" data-auto>PSA jetzt prüfen (Grades fertig?)</button>
  <p class="mut" style="margin:0">Der Server prüft das sonst automatisch einmal am Tag ab 9 Uhr. Jede PSA-Nummer wird dabei höchstens einmal am Tag abgefragt, gemeinsam mit dem Status-Check der Kunden.</p>
  <div style="text-align:right"><button class="b-cy" value="ok">Schließen</button></div>
</form></dialog>

<div class="toast" data-toast></div>

<script>
(function () {
  var state = { orders: [], stages: [], filter: 'open', q: '' };
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var toastT;
  function toast(m) { var t = $('[data-toast]'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('on'); }, 3500); }
  function api(method, url, body) {
    return fetch(url, { method: method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin' })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Fehler'); return j; }); });
  }
  function fmt(iso) { return iso ? new Date(iso).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' }) : ''; }
  function lbl(s, o) { return s.label.replace('{G}', o.grader || 'PSA'); }

  function load() {
    return api('GET', '/admin/api/orders').then(function (d) {
      state.orders = d.orders; state.stages = d.stages;
      var n = '';
      if (!d.smtp) n += '<div class="note"><b>Probelauf:</b> Der Mail-Versand ist noch nicht eingerichtet (SMTP-Variablen in Railway). Haken funktionieren, Mails werden aber nur protokolliert.</div>';
      $('[data-notes]').innerHTML = n;
      draw();
    }).catch(function (e) { $('[data-list]').innerHTML = '<p class="empty">Fehler: ' + esc(e.message) + '</p>'; });
  }

  function visible() {
    var q = state.q.toLowerCase();
    return state.orders.filter(function (o) {
      var done = !!o.stages.versendet;
      if (state.filter === 'open' && (o.archived || done)) return false;
      if (state.filter === 'arch' && !o.archived) return false;
      if (!q) return true;
      return [o.nr, o.name, o.email, o.psa, o.tracking, o.note].join(' ').toLowerCase().indexOf(q) > -1;
    });
  }

  function card(o) {
    var items = o.items.map(function (i) { return esc(i.qty) + '× ' + esc(i.title) + (i.variant ? ' <i>(' + esc(i.variant) + ')</i>' : ''); }).join('<br>');
    var st = state.stages.map(function (s) {
      var on = !!o.stages[s.key];
      var mail = o.mails[s.key] ? 'Mail ' + fmt(o.mails[s.key]) : (on ? 'ohne Mail' : '');
      return '<button class="st' + (on ? ' on' : '') + '" data-stage="' + s.key + '" data-id="' + esc(o.id) + '"><i>' + (on ? '✓' : '') + '</i><span>' + esc(lbl(s, o)) + '<small>' + esc(mail) + '</small></span></button>';
    }).join('');
    var last = (o.log && o.log[0]) ? fmt(o.log[0].at) + ' · ' + esc(o.log[0].msg) : '';
    return '<article class="card' + (o.stages.versendet ? ' is-done' : '') + '" data-card="' + esc(o.id) + '">' +
      '<div class="top"><span class="nr">' + esc(o.nr) + '</span><span class="who"><b>' + esc(o.name || '–') + '</b> <span class="mut">' + esc(o.email) + '</span></span>' +
      '<span class="tag ' + (o.grader === 'GSG' ? 'gsg' : 'psa') + '">' + esc(o.grader) + '</span>' + (o.pickup ? '<span class="tag pick">Abholung</span>' : '') +
      '<span class="mut">' + esc(o.qty) + ' Karte' + (o.qty === 1 ? '' : 'n') + ' · ' + fmt(o.created) + '</span></div>' +
      '<div class="items">' + (items || '<i>keine Positionen</i>') + '</div>' +
      '<div class="fields">' +
        (o.grader === 'PSA' ? '<label>PSA-Submission-Nr.<input data-f="psa" value="' + esc(o.psa) + '" placeholder="14348423, 14348424"></label>' : '') +
        '<label>Sendungsnummer (Rückversand)<input data-f="tracking" value="' + esc(o.tracking) + '"></label>' +
        '<label>Notiz (intern)<input data-f="note" value="' + esc(o.note) + '"></label>' +
      '</div>' +
      '<div class="stages">' + st + '</div>' +
      '<div class="foot"><span class="log">' + last + '</span><span class="acts">' +
        '<button class="b-gh" data-pickup>' + (o.pickup ? 'Versand statt Abholung' : 'Abholung') + '</button>' +
        '<button class="b-gh" data-arch>' + (o.archived ? 'Aus Archiv holen' : 'Archivieren') + '</button>' +
      '</span></div></article>';
  }

  function draw() {
    var list = visible();
    $('[data-list]').innerHTML = list.length ? list.map(card).join('') : '<p class="empty">Keine Aufträge in dieser Ansicht.</p>';
  }
  function replace(o) {
    var i = state.orders.findIndex(function (x) { return x.id === o.id; });
    if (i > -1) state.orders[i] = o; else state.orders.unshift(o);
    var el = document.querySelector('[data-card="' + CSS.escape(o.id) + '"]');
    if (el) el.outerHTML = card(o); else draw();
  }

  // Felder speichern beim Verlassen
  document.addEventListener('change', function (e) {
    var f = e.target.getAttribute('data-f'); if (!f || !e.target.closest('[data-card]')) return;
    var id = e.target.closest('[data-card]').getAttribute('data-card'); var body = {}; body[f] = e.target.value;
    api('PATCH', '/admin/api/orders/' + encodeURIComponent(id), body).then(function (o) {
      var i = state.orders.findIndex(function (x) { return x.id === o.id; }); state.orders[i] = o; toast('Gespeichert');
    }).catch(function (er) { toast(er.message); });
  });

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-stage]');
    if (b) {
      var id = b.getAttribute('data-id'), key = b.getAttribute('data-stage');
      var o = state.orders.find(function (x) { return x.id === id; });
      var s = state.stages.find(function (x) { return x.key === key; });
      var on = !o.stages[key];
      if (on) {
        var mailed = !!o.mails[key];
        var q = mailed ? '„' + lbl(s, o) + '“ setzen? Die Mail war schon raus und wird nicht nochmal gesendet.' : '„' + lbl(s, o) + '“ setzen und Mail an ' + o.email + ' senden?';
        if (!confirm(q)) return;
      } else if (!confirm('Haken „' + lbl(s, o) + '“ entfernen? Es wird keine Mail gesendet.')) return;
      b.disabled = true;
      api('POST', '/admin/api/orders/' + encodeURIComponent(id) + '/stage', { stage: key, on: on })
        .then(function (r) { replace(r); toast(r.result ? lbl(s, o) + ': ' + r.result : 'Gespeichert'); })
        .catch(function (er) { b.disabled = false; toast(er.message); });
      return;
    }
    var card_ = e.target.closest('[data-card]');
    if (card_ && e.target.closest('[data-arch]')) {
      var oa = state.orders.find(function (x) { return x.id === card_.getAttribute('data-card'); });
      api('PATCH', '/admin/api/orders/' + encodeURIComponent(oa.id), { archived: !oa.archived }).then(function (r) { replace(r); draw(); });
      return;
    }
    if (card_ && e.target.closest('[data-pickup]')) {
      var op = state.orders.find(function (x) { return x.id === card_.getAttribute('data-card'); });
      api('PATCH', '/admin/api/orders/' + encodeURIComponent(op.id), { pickup: !op.pickup }).then(replace);
      return;
    }
    var chip = e.target.closest('[data-f].chip');
    if (chip) { state.filter = chip.getAttribute('data-f'); document.querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-pressed', String(c === chip)); }); draw(); }
  });

  $('[data-q]').addEventListener('input', function (e) { state.q = e.target.value; draw(); });
  $('[data-new]').addEventListener('click', function () { $('[data-form-new]').reset(); $('[data-dlg-new]').showModal(); });
  $('[data-dlg-new]').addEventListener('close', function () {
    if ($('[data-dlg-new]').returnValue !== 'ok') return;
    var f = $('[data-form-new]');
    api('POST', '/admin/api/orders', { nr: f.nr.value, name: f.name.value, email: f.email.value, items: f.items.value, grader: f.grader.value, pickup: f.pickup.checked })
      .then(function (o) { replace(o); toast('Auftrag ' + o.nr + ' angelegt'); }).catch(function (er) { toast(er.message); });
  });
  $('[data-more]').addEventListener('click', function () { $('[data-dlg-more]').showModal(); });
  $('[data-test]').addEventListener('click', function () {
    api('POST', '/admin/api/test-mail', { to: $('[data-test-to]').value }).then(function (r) { toast('Test-Mail: ' + r.result); }).catch(function (er) { toast(er.message); });
  });
  $('[data-auto]').addEventListener('click', function () {
    api('POST', '/admin/api/auto-check').then(function (r) { toast(r.mails && r.mails.length ? 'Grades-Mails an: ' + r.mails.join(', ') : 'Geprüft, keine neuen Grades'); load(); }).catch(function (er) { toast(er.message); });
  });
  load();
})();
</script>
</body>
</html>
